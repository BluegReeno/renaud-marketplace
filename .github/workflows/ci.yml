name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-sync:
    name: Version sync + CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check plugin version invariant
        run: bash scripts/check_version_sync.sh
      - name: Check /improve map is up to date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_improve_map.py
          git diff --exit-code

  identity-guard:
    name: No identity literal in multi-user skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded slugs, calendars and mailboxes
        run: bash scripts/check_no_identity_literals.sh

  test-identity-guard:
    name: Offline tests — check_no_identity_literals.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline tests
        run: bash scripts/test_check_no_identity_literals.sh

  test-release-script:
    name: Offline tests — release.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: bash scripts/test_release.sh

  vault-reader-tests:
    name: Offline tests — jobsearch-vault device_bash reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 tests/test_vault_reader_heredoc.py

  marketplace-schema:
    name: Marketplace schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace.json schema and paths
        run: bash scripts/check_marketplace_schema.sh

  test-generate-improve-map:
    name: Offline tests — generate_improve_map.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 scripts/test_generate_improve_map.py

  test-backfill-entretien-links:
    name: Offline tests — backfill_entretien_links.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 tests/test_backfill_entretien_links.py

  test-next-skills:
    name: Text tests — skills on the target hal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run text tests
        run: python3 tests/test_next_skills.py
      - name: Run cv-master fact guards
        run: python3 tests/test_cv_master_facts.py
      - name: Run offer-to-cv guards (skill, judge, P4 cells)
        run: python3 tests/test_offer_to_cv.py

  test-cv-generator:
    name: Offline tests — generate_cv.py overrides and bundled font
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 tests/test_generate_cv_overrides.py

  cv-batch-render:
    name: Render the 30 CVs on Linux — 1 page each, bundled font only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pango for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install WeasyPrint and pikepdf
        run: python3 -m pip install --quiet weasyprint pikepdf
      - name: Render and validate
        # The Linux render is the one that matters: the Cowork sandbox is Linux, and before the
        # font was bundled every CV dropped to compact level 3/3 there (renaud#176 §7).
        run: python3 plugins/jobsearch/scripts/batch_validate.py

  test-command-center:
    name: Offline tests — Command Center parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline tests
        run: node tests/test_command_center_parser.js

  deno-check:
    name: Deno type check (gmail-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check edge function
        working-directory: servers/gmail-mcp/supabase/functions/gmail-mcp
        run: deno check index.ts
